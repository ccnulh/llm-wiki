# Render 部署配置
# 登录 Render.com -> New -> Blueprint -> 选择此文件

services:
  - type: web
    name: llm-wiki
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -b 0.0.0.0:$PORT -w 1 --timeout 300 --graceful-timeout 30
    rootDir: .
    envVars:
      - key: PYTHON_VERSION
        value: 3.11

      # ===== LLM：火山方舟 ARK（GLM-5.1）=====
      - key: LLM_PROVIDER
        value: volcengine
      - key: LLM_MODEL
        value: glm-5.1
      - key: ARK_API_KEY
        sync: false
      - key: ARK_BASE_URL
        value: https://ark.cn-beijing.volces.com/api/v3

      # 阿里云 DashScope（备用，可在控制台留空）
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_MODEL
        value: qwen-plus
      - key: DASHSCOPE_BASE_URL
        value: https://dashscope.aliyuncs.com/api/v1

      # 阿里云 ASR (语音转文字)
      - key: ASR_APP_KEY
        sync: false
      - key: ASR_ACCESS_KEY_ID
        sync: false
      - key: ASR_ACCESS_KEY_SECRET
        sync: false

      # 飞书配置
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false

      # 腾讯云 COS 配置
      - key: COS_SECRET_ID
        sync: false
      - key: COS_SECRET_KEY
        sync: false
      - key: COS_BUCKET_NAME
        value: llm-wiki-1314467141
      - key: COS_REGION
        value: ap-beijing

      # 编译配置
      - key: AUTO_COMPILE
        value: "true"
      - key: COMPILE_BATCH_SIZE
        value: "1"

      # 云端运行时标记（让代码用 COS 而不是本地磁盘）
      - key: USE_COS_STORAGE
        value: "true"
      - key: DATA_ROOT
        value: /tmp/llm-wiki-data